<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Contact | Everyone.AI</title>
<meta name="description" content="Contact everyone.AI, a 501(c)(3) nonprofit working for beneficial AI for children: send us a message or write to us.">
<link rel="canonical" href="https://everyone.ai/contact/">
<link rel="icon" type="image/png" href="assets/logo-everyone-ai.png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f0f2f6;color:#222;font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-wrap:pretty}a{color:#829bcb}a:hover{color:#f8903e}@media (max-width:760px){[data-g2]{grid-template-columns:1fr!important}}</style>
</helmet>
<div data-screen-label="Contact" style="min-height:100vh;display:flex;flex-direction:column;background:#f0f2f6">
<dc-import name="SiteHeader" active="contact" hint-size="100%,158px"></dc-import>
<section style="background:#35425b;padding:64px 20px;text-align:center"><h1 style="margin:0;font:300 clamp(28px,4vw,48px)/1.2 Poppins,sans-serif;color:#fff;text-transform:uppercase;letter-spacing:.04em">Contact us</h1></section>
<main style="flex:1;max-width:960px;width:100%;margin:0 auto;padding:72px 20px 88px;box-sizing:border-box">
<div data-g2="" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:28px;align-items:start">
<div style="background:#fff;border-radius:8px;padding:32px">
<h2 style="margin:0;font:600 22px/1.3 'Open Sans',sans-serif;color:#000">Reach us</h2>
<p style="margin:14px 0 0;font:300 16px/1.7 'Open Sans',sans-serif">Questions, partnerships, press or research: we read every message.</p>
<p style="margin:14px 0 0;font:600 16px/1.7 'Open Sans',sans-serif"><a href="mailto:eai-contact-email">eai-contact-email</a></p>
<!--eai-address-->
</div>
<form style="background:#fff;border-radius:8px;padding:32px;display:flex;flex-direction:column;gap:18px">
<h2 style="margin:0;font:600 22px/1.3 'Open Sans',sans-serif;color:#000">Send a message</h2>
<label style="display:flex;flex-direction:column;gap:6px;font:600 14px/1.4 'Open Sans',sans-serif;color:#333"><span>Name *</span><input name="name" type="text" required="required" autoComplete="name" style="box-sizing:border-box;padding:11px 14px;border:1px solid #d5dbe6;border-radius:4px;font:400 15px/1.4 'Open Sans',sans-serif"></label>
<label style="display:flex;flex-direction:column;gap:6px;font:600 14px/1.4 'Open Sans',sans-serif;color:#333"><span>Email *</span><input name="email" type="email" required="required" autoComplete="email" style="box-sizing:border-box;padding:11px 14px;border:1px solid #d5dbe6;border-radius:4px;font:400 15px/1.4 'Open Sans',sans-serif"></label>
<label style="display:flex;flex-direction:column;gap:6px;font:600 14px/1.4 'Open Sans',sans-serif;color:#333"><span>Message *</span><textarea name="message" rows="6" required="required" style="box-sizing:border-box;padding:11px 14px;border:1px solid #d5dbe6;border-radius:4px;font:400 15px/1.5 'Open Sans',sans-serif;resize:vertical"></textarea></label>
<div><button type="submit" style="background:#f8903e;color:#fff;border:0;font:500 15px/1 Poppins,sans-serif;padding:14px 32px;border-radius:999px;cursor:pointer" style-hover="background:#e97f2d">Send</button></div>
</form>
</div>
</main>
<dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
</body>
</html>
